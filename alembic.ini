# Alembic Configuration File
# This file contains settings for Alembic migration tool

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to python's datetime.datetime.now(datetime.timezone(datetime.timedelta(0)))
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by the revision ID system
# and passed to the file_template rendering context
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# if set to 'true', resources are created in the versions directory
# as individual .py scripts. If set to 'false', they are assembled into
# a single `versions.py` module with the revision data inside.
# file_per_migration = false

# When set to "true", this option enforces that new migrations must
# have at least one change;
# when false, new migrations may be empty
# require_migration_to_resolve_dependencies = true

# When set to "true", the alembic version table is created
# in the same schema as the target tables instead of on the 'public' schema.
# of the databases supported by SQLAlchemy, only MySQL and PostgreSQL
# support setting this variable to "true"
# sqlalchemy_server_default_dialect = true

# set to list of string import names that should be imported
# in the env.py file, e.g. migration_imports = "sqlalchemy_utils"
#
# migration_imports =

# a list of dotted import names of custom comparators that should
# be used against the types obj describing what's being compared;
# this is used as a library of custom comparators that deal only in
# comparing between two specific types. a common example, if
# comparators were used, would be against derived types or types
# within different databases that have an important role
# in custom comparisons that could construct the types differently
#
# comparators =

# a list of files or directories to skip when searching for Python files
# within the versions/ directory
#
# version_path_separator is the character used to split version.path
# into its path segment. The default value is the previous behavior
# of splitting on the colon (:) character, which does work, except in windows
# environments where the colon is an invalid character in of course part of
# the drive letter. To override this, use the following separator to occur
# in your directories names; alembic will accept either. due to the bit
# of extra complexity- then it is recommended to not use if avoidable.
# In windows env. avoid setting it to colon (:).
#
# version_path_separator = :
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version location specification; this defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified for each
# location using the --version-path option when creating
# new revision files
# version_locations = %(here)s/alembic/versions

# version file format; this is normally only changed from its default
# if the revision IDs in your existing history was created with
# new_variable_type having the old_variable_type valuename formatting
# file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is set from settings.database_url in env.py
sqlalchemy.url =

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlglue.echo = false

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
